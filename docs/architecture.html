<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataProxy 整体架构</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f8f5;
      --ink: #1c2d31;
      --muted: #496068;
      --rule: #cbd5d1;
      --zone: #edf2ef;
      --accent: #a43c24;
      --tint: #fff4ed;
      --link: #285878;
      --white: #ffffff;
      --sans: Geist, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      --mono: "Geist Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    main { max-width: 1360px; margin: auto; padding: 36px clamp(16px, 3vw, 40px) 24px; }
    header { margin-inline: 24px; }
    h1 {
      margin: 0 0 8px;
      font: 400 clamp(28px, 4vw, 46px)/1.18 "Instrument Serif", "Songti SC", "Noto Serif CJK SC", serif;
    }
    header p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
    figure { margin: 16px 0 0; }
    .diagram-container { overflow-x: auto; }
    .diagram-container:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }
    svg { width: 100%; min-width: 1280px; display: block; }
    svg text { fill: var(--ink); font-family: var(--sans); }
    .zone { fill: var(--zone); stroke: #8fa39d; stroke-dasharray: 6 5; }
    .node { fill: var(--white); stroke: #93a7a2; }
    .focal { fill: var(--tint); stroke: var(--accent); stroke-width: 1.5; }
    .optional { fill: var(--white); stroke: #93a7a2; stroke-dasharray: 5 4; }
    .zone-name { font-size: 16px; font-weight: 700; }
    .name { font-size: 20px; font-weight: 700; }
    .compact-name { font-size: 16px; font-weight: 700; }
    .detail { font-size: 14px; fill: var(--muted); }
    .small, .label { font-size: 12px; fill: var(--muted); }
    .label { font-weight: 600; }
    .tech { font-family: var(--mono), var(--sans); }
    .label-accent { fill: var(--accent); }
    .label-link { fill: var(--link); }
    .data, .outbound, .control { fill: none; }
    .data { stroke: var(--accent); stroke-width: 2; }
    .outbound { stroke: var(--link); stroke-width: 1.7; stroke-dasharray: 6 4; }
    .control { stroke: var(--muted); stroke-width: 1.35; stroke-dasharray: 4 4; }
    .rule { stroke: var(--rule); }
    .mask { fill: var(--paper); }
    .mask-zone { fill: var(--zone); }
    figcaption { margin: 0 24px; max-width: 90ch; color: var(--muted); font-size: 14px; line-height: 1.65; }
    @media (max-width: 680px) {
      main { padding-top: 24px; }
      header, figcaption { margin-inline: 8px; }
    }
    @media print {
      main { padding: 0; }
      figure { break-inside: avoid; }
      .diagram-container { overflow: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>DataProxy 整体架构</h1>
      <p>中心平台通过客户 Agent 主动建立的反向隧道，读取客户内网服务。</p>
    </header>

    <figure>
      <div class="diagram-container" tabindex="0" role="region" aria-label="整体架构图，可横向滚动">
        <svg viewBox="0 0 1280 672" xmlns="http://www.w3.org/2000/svg" role="img"
             aria-labelledby="architecture-title architecture-desc">
          <title id="architecture-title">DataProxy 整体架构</title>
          <desc id="architecture-desc">客户 Agent 主动连接中心 Hub 并建立多路复用隧道；中心平台的请求经过 Hub、Agent 的本地策略和可选目标侧 TLS 到达内网服务，Hub 还提供控制面和可选的跨节点转发。</desc>
          <defs>
            <marker id="arrow-data" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
              <path d="M0 0L7 3L0 6Z" fill="#a43c24"/>
            </marker>
            <marker id="arrow-outbound" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
              <path d="M0 0L7 3L0 6Z" fill="#285878"/>
            </marker>
            <marker id="arrow-control" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
              <path d="M0 0L7 3L0 6Z" fill="#496068"/>
            </marker>
          </defs>

          <rect x="0" y="0" width="1280" height="672" fill="#f7f8f5"/>
          <rect class="zone" x="260" y="20" width="484" height="588" rx="8"/>
          <rect class="zone" x="936" y="20" width="320" height="588" rx="8"/>
          <text class="zone-name" x="280" y="52">中心侧 · DataProxy Hub</text>
          <text class="zone-name" x="956" y="52">客户私有网络</text>
          <text class="small" x="956" y="76">按租户部署 Agent · 无需开放公网入站端口</text>

          <g aria-hidden="true">
            <line class="data" x1="216" y1="304" x2="280" y2="304" marker-end="url(#arrow-data)"/>
            <line class="data" x1="724" y1="304" x2="952" y2="304" marker-end="url(#arrow-data)"/>
            <line class="outbound" x1="952" y1="372" x2="724" y2="372" marker-end="url(#arrow-outbound)"/>
            <line class="data" x1="1096" y1="428" x2="1096" y2="500" marker-end="url(#arrow-data)"/>
            <line class="control" x1="536" y1="132" x2="564" y2="132" marker-end="url(#arrow-control)"/>
            <line class="control" x1="408" y1="180" x2="408" y2="220" marker-end="url(#arrow-control)"/>
            <line class="control" x1="612" y1="428" x2="612" y2="500" marker-end="url(#arrow-control)"/>

            <rect class="mask" x="760" y="268" width="156" height="26" rx="4"/>
            <text class="label label-accent" x="838" y="286" text-anchor="middle">业务请求 · Yamux 流</text>
            <rect class="mask" x="768" y="336" width="140" height="26" rx="4"/>
            <text class="label label-link" x="838" y="354" text-anchor="middle">Agent 主动建连</text>
            <text class="small tech" x="838" y="396" text-anchor="middle">WSS / TLS TCP</text>
            <text class="small" x="838" y="415" text-anchor="middle">可配置 mTLS</text>
            <rect class="mask-zone" x="1106" y="449" width="126" height="24" rx="3"/>
            <text class="label" x="1112" y="466">目标侧 TLS 可选</text>
            <rect class="mask-zone" x="418" y="188" width="132" height="24" rx="3"/>
            <text class="label" x="424" y="205">租户与端口绑定</text>
            <rect class="mask-zone" x="622" y="449" width="106" height="24" rx="3"/>
            <text class="label" x="628" y="466">无本地路由时</text>
          </g>

          <g>
            <rect class="node" x="24" y="248" width="192" height="140" rx="8"/>
            <text class="name" x="44" y="282">中心平台</text>
            <line class="rule" x1="44" y1="300" x2="196" y2="300"/>
            <text class="detail" x="44" y="326">采集任务与业务应用</text>
            <text class="detail" x="44" y="350">数据库 / HTTP 客户端</text>
          </g>

          <g>
            <rect class="node" x="280" y="84" width="256" height="96" rx="8"/>
            <text class="compact-name" x="300" y="113">控制面 · Admin API</text>
            <text class="detail" x="300" y="139">短效任务票据、租户与动态端口</text>
            <text class="detail" x="300" y="161">设备挂载码与吊销 · /metrics</text>
          </g>

          <g>
            <rect class="optional" x="564" y="84" width="160" height="96" rx="8"/>
            <text class="compact-name" x="580" y="113">节点本地状态</text>
            <text class="detail" x="580" y="139">设备 CA 与设备状态</text>
            <text class="detail" x="580" y="161">动态租户与端口绑定</text>
          </g>

          <g>
            <rect class="focal" x="280" y="220" width="444" height="208" rx="8"/>
            <text class="name" x="300" y="256">dataproxy-hub</text>
            <text class="small" x="704" y="255" text-anchor="end">按租户与逻辑服务路由</text>
            <line class="rule" x1="300" y1="268" x2="704" y2="268"/>
            <text class="detail" x="300" y="293">专用 TCP · 静态 / 动态绑定、源 IP CIDR</text>
            <text class="detail" x="300" y="317">SOCKS5 / HTTP CONNECT · 调用方 ACL</text>
            <text class="detail" x="300" y="341">HTTP / WebSocket · 调用方 ACL 或票据</text>
            <text class="detail" x="300" y="365">数据库票据入口 · MySQL / PostgreSQL / MongoDB / Redis</text>
            <line class="rule" x1="300" y1="380" x2="704" y2="380"/>
            <text class="detail" x="300" y="405">隧道鉴权 · Agent 会话注册、配额与副本选择</text>
          </g>

          <g>
            <rect class="optional" x="496" y="500" width="228" height="84" rx="8"/>
            <text class="compact-name" x="516" y="530">对端 Hub · Mesh 可选</text>
            <text class="detail" x="516" y="557">内网 TCP 单跳转发至对端会话</text>
          </g>

          <g>
            <rect class="focal" x="952" y="220" width="288" height="208" rx="8"/>
            <text class="name" x="972" y="256">dataproxy-agent</text>
            <line class="rule" x1="972" y1="268" x2="1220" y2="268"/>
            <text class="detail" x="972" y="293">服务白名单、访问时段、并发与限速</text>
            <text class="detail" x="972" y="317">可配置协议只读与本地凭据代填</text>
            <text class="detail" x="972" y="341">注册、心跳、脱敏健康上报</text>
            <text class="detail" x="972" y="365">支持多隧道连接池与设备证书轮换</text>
            <line class="rule" x1="972" y1="380" x2="1220" y2="380"/>
            <text class="detail" x="972" y="405">访问事由审计 · 本地日志 / Syslog</text>
          </g>

          <g>
            <rect class="node" x="952" y="500" width="288" height="100" rx="8"/>
            <text class="compact-name" x="972" y="525">客户内网白名单服务</text>
            <text class="detail" x="972" y="548">MySQL · PostgreSQL</text>
            <text class="detail" x="972" y="568">MongoDB · Redis</text>
            <text class="detail" x="972" y="588">HTTP(S) / WebSocket / TCP</text>
          </g>

          <g aria-hidden="true">
            <line class="data" x1="24" y1="636" x2="55" y2="636" marker-end="url(#arrow-data)"/>
            <text class="label" x="66" y="641">请求方向，响应原路返回</text>
            <line class="outbound" x1="260" y1="636" x2="291" y2="636" marker-end="url(#arrow-outbound)"/>
            <text class="label" x="302" y="641">隧道建连方向</text>
            <line class="control" x1="460" y1="636" x2="491" y2="636" marker-end="url(#arrow-control)"/>
            <text class="label" x="502" y="641">控制或可选转发</text>
          </g>
        </svg>
      </div>
      <figcaption>目标地址由 Agent 的本地白名单映射。启用目标侧 TLS 时，MySQL 和 PostgreSQL 在协议握手中升级，MongoDB、Redis 和 HTTPS 可由 Agent 直接建立 TLS。</figcaption>
    </figure>
  </main>
</body>
</html>
